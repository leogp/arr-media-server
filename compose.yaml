# Arr media server stack: one Compose file for Linux (Fedora, Ubuntu) and Windows (Docker Desktop + WSL2).
#
# Before the first `docker compose up -d`:
#   - All OSes: copy .env.example to .env and set DATA_ROOT (host folder that holds downloads/, movies/, tvshows/).
#   - Fedora:   label DATA_ROOT and this project directory persistently with
#               `semanage fcontext -a -t container_file_t` + `restorecon -RFv`.
#               Volumes intentionally carry no :z/:Z flags. See README "Fedora guide".
#   - Ubuntu:   create the DATA_ROOT subfolders and chown them to PUID:PGID. See README "Ubuntu guide".
#   - Windows:  keep DATA_ROOT inside the WSL2 filesystem for hardlinks. See README "Windows guide".
#
# Optional extras (see README "Choose your compose file" and "Hardware transcoding"):
#   - GPU overlays via COMPOSE_FILE in .env (docker-compose.gpu-vaapi.yml, docker-compose.gpu-nvidia.yml).
#   - FlareSolverr via COMPOSE_PROFILES=flaresolverr in .env.

services:
  # Torrent client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    volumes:
      - ./qbittorrent/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    ports:
      - "8080:8080" # Web UI
      - "6881:6881" # TCP port for torrents
      - "6881:6881/udp" # UDP port for torrents
    env_file:
      - .env
  # Indexer: search torrent and send the magnet link to the torrent client
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696" # Web UI
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  # Optional: solves Cloudflare challenges for Prowlarr indexers.
  # Disabled by default; enable with COMPOSE_PROFILES=flaresolverr in .env.
  # Only reachable from other containers at http://flaresolverr:8191 (no host port).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    profiles:
      - flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
  # Media management (tv shows and movies)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    volumes:
      - ./sonarr/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    ports:
      - "8989:8989" # Web UI
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    volumes:
      - ./radarr/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    ports:
      - "7878:7878" # Web UI
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  # Subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    volumes:
      - ./bazarr/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    ports:
      - "6767:6767" # Web UI
    env_file:
      - .env
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
  # Netflix-style user interface for requesting multimedia content (Seerr, successor of Jellyseerr).
  # Reuses ./jellyseerr/config, which Seerr migrates automatically on first start.
  # The container runs as UID 1000, so the config folder must be owned by 1000:1000.
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    volumes:
      - ./jellyseerr/config:/app/config
    ports:
      - "5055:5055" # Web UI
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info # change to debug if it's necessary
      - TZ=${TZ}
  # Multimedia Streaming Server. Transfer content to the client device
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    shm_size: "1gb"
    hostname: jellyfin
    restart: unless-stopped
    volumes:
      - ./jellyfin/config:/config
      - ${DATA_ROOT:?Set DATA_ROOT in .env}:/data
    ports:
      - "8096:8096/tcp" # Web UI
      - "7359:7359/udp" # Automatic server discovery
      - "1900:1900/udp" # DLNA/UPnP
    environment:
      - JELLYFIN_CACHE_DIR=/tmp
    env_file:
      - .env
